---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify role marker directory exists
      ansible.builtin.stat:
        path: /etc/tuxpeople-platform
      register: common_marker_dir

    - name: Assert marker directory exists
      ansible.builtin.assert:
        that:
          - common_marker_dir.stat.exists
          - common_marker_dir.stat.isdir
