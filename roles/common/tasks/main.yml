---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Unsupported OS family: {{ ansible_os_family }}.
      Supported: Debian (Ubuntu 24.04), RedHat (Rocky 9) - see README.
  tags:
    - common

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags:
    - common

- name: Ensure platform marker directory exists
  ansible.builtin.file:
    path: "{{ common_marker_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - common

- name: Install common base packages
  ansible.builtin.package:
    name: "{{ common_base_packages }}"
    state: present
  when: common_manage_packages | bool
  tags:
    - common
    - packages
