---
- name: Ensure platform marker directory exists
  ansible.builtin.file:
    path: "{{ rke2_marker_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - rke2

- name: Ensure RKE2 config directory exists
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: rke2_enabled | bool
  tags:
    - rke2
    - configure

- name: Render RKE2 config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_file }}"
    owner: root
    group: root
    mode: "0600"
  when: rke2_enabled | bool
  notify: Restart rke2
  tags:
    - rke2
    - configure

- name: Explain disabled RKE2 installation
  ansible.builtin.debug:
    msg: "rke2_enabled=false; this template role does not install RKE2 until explicitly enabled."
  when: not rke2_enabled | bool
  tags:
    - rke2
