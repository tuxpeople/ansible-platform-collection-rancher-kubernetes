---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint and sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/tuxpeople/rancher_kubernetes
    steps:
      # ansible-test needs the collection below ansible_collections/<namespace>/<name>
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/tuxpeople/rancher_kubernetes

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint .

      - name: Run ansible-test sanity
        run: ansible-test sanity --docker default -v

  molecule:
    name: Molecule – ${{ matrix.role }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # ansible-core 2.21 needs Python >= 3.12
        python:
          - "3.12"
          - "3.14"
        role:
          - common
          - rke2
          - harbor
          - rancher
    steps:
      # ansible-test needs the collection below ansible_collections/<namespace>/<name>
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/tuxpeople/rancher_kubernetes

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        working-directory: ansible_collections/tuxpeople/rancher_kubernetes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Run Molecule for role ${{ matrix.role }}
        working-directory: ansible_collections/tuxpeople/rancher_kubernetes/roles/${{ matrix.role }}
        run: molecule test
